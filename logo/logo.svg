<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .navy { fill: #10203D; }
  .gold { fill: #B8935A; }
  .navyText { fill: #10203D; font-family: 'Georgia', 'Times New Roman', serif; }
  .goldText { fill: #B8935A; font-family: 'Georgia', 'Times New Roman', serif; }
  .tagline { fill: #7A8699; font-family: Arial, sans-serif; letter-spacing: 3px; }
</style>
</defs>

<!-- Icon mark -->
<rect x="20" y="20" width="150" height="150" rx="28" class="navy"/>
<rect x="60" y="110" width="18" height="40" rx="3" fill="#FFFFFF" opacity="0.92"/>
<rect x="86" y="90" width="18" height="60" rx="3" fill="#FFFFFF" opacity="0.92"/>
<rect x="112" y="65" width="18" height="85" rx="3" fill="#FFFFFF" opacity="0.92"/>
<circle cx="130" cy="50" r="9" class="gold"/>

<!-- Wordmark -->
<text x="210" y="105" font-size="56" class="navyText">Insight<tspan class="goldText">AI</tspan></text>
<text x="212" y="138" font-size="14" class="tagline">EXPLAINABLE BUSINESS INTELLIGENCE</text>
</svg>
